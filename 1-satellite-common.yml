---
- name: Subscribe host and install required packages
  hosts: all
  vars:
    firewall:
      - service: https
        state: enabled
      - service: http
        state: enabled
      - service: RH-Satellite-6
        state: enabled
    repos:
      - rhel-9-for-x86_64-baseos-rpms
      - rhel-9-for-x86_64-appstream-rpms
      - satellite-6.19-for-rhel-9-x86_64-rpms
      - satellite-maintenance-6.19-for-rhel-9-x86_64-rpms
    packages:
      - satellite
      - rhel-system-roles
      - nfs-utils
      - vim-enhanced
      - virt-who
    ansible_remote_tmp: /dev/shm/ansible

  roles:
    - role: redhat.rhel_system_roles.firewall

  tasks:
    - name: Register to Red Hat Subscription Management Network
      redhat.rhel_system_roles.redhat_subscription:
        state: present
        username: "{{ rhsm_username }}"
        password: "{{ rhsm_password }}"
        release: "9.7"
        auto_attach: true

    - name: Disable all RHSM repositories
      redhat.rhel_system_roles.rhsm_repository:
        name: '*'
        state: disabled

    - name: Enable required RHSM Repositories
      redhat.rhel_system_roles.rhsm_repository:
        name: "{{ repos }}"
        state: enabled

    - name: Install required packages
      ansible.builtin.dnf:
        name: "{{ packages }}"
        state: present

    - name: Add hostname to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ ansible_default_ipv4.address }}.*{{ inventory_hostname }}'
        line: "{{ ansible_default_ipv4.address }} {{ inventory_hostname }} {{ ansible_hostname }}"
        state: present

    - name: Temporarily remount /tmp and /var/tmp with exec permissions
      ansible.builtin.command: mount -o remount,exec {{ item }}
      loop:
        - /tmp
        - /var/tmp
      ignore_errors: true
      changed_when: false
