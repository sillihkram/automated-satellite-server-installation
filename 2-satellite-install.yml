---
- name: Install and Configure Red Hat Satellite Server
  hosts: all
  pre_tasks:

    # Temporarily commented out while fapolicyd is disabled.
    # Placed in pre_tasks so it runs BEFORE the installer role.
    # - name: Ensure Postgresql has the correct permissions to run
    #   ansible.builtin.file:
    #     path: '/usr/bin/postmaster'
    #     owner: 'postgres'
    #     group: 'postgres'
    #     mode: '0755'
    #     state: 'file'

  roles:
    - role: redhat.satellite_operations.installer
      vars:
        satellite_installer_scenario: satellite
        satellite_installer_package: satellite-installer
        satellite_installer_no_colors: true
        satellite_installer_options:
          - '--foreman-initial-organization "openincite.net"'
          - '--foreman-initial-admin-password "{{ satellite_password }}"'
          
    - role: redhat.satellite_operations.cloud_connector
      vars:
        satellite_cloud_connector_url: '{{ satellite_url }}'
        satellite_cloud_connector_user: '{{ satellite_username }}'
        satellite_cloud_connector_password: '{{ satellite_password }}'

  post_tasks:
    # -------------------------------------------------------------------------
    # Publish Foreman Proxy SSH Key for Push REX Onboarding
    # -------------------------------------------------------------------------
    - name: Ensure Satellite public web folder exists
      ansible.builtin.file:
        path: /var/www/html/pub
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Find generated Foreman Proxy SSH public key
      ansible.builtin.find:
        paths: /usr/share/foreman-proxy/.ssh
        patterns: "id_*.pub"
      register: foreman_proxy_keys

    - name: Copy Foreman Proxy SSH public key to web root
      ansible.builtin.copy:
        src: "{{ foreman_proxy_keys.files[0].path }}"
        dest: /var/www/html/pub/remote_execution_ssh_keys.pub
        remote_src: true
        owner: root
        group: root
        mode: '0644'
        seuser: system_u
        serole: object_r
        setype: httpd_sys_content_t
      when: foreman_proxy_keys.matched > 0
