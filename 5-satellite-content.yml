---
- name: Configure Satellite Content Views and Activation Keys
  hosts: localhost
  connection: local
  gather_facts: false
  run_once: true

  vars:
    satellite_org: "openincite.net"
    satellite_product: "Red Hat Enterprise Linux for x86_64"
    
    # Environment & Content View Definitions
    lifecycle_environment: "Development"
    content_view: "RHEL-SOE"
    activation_key: "rhel-soe-dev"

  tasks:
    - name: Create Lifecycle Environment
      redhat.satellite.lifecycle_environment:
        server_url: "{{ satellite_url }}"
        username: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        validate_certs: false
        organization: "{{ satellite_org }}"
        name: "{{ lifecycle_environment }}"
        prior: "Library"
        state: present

    - name: Create Content View
      redhat.satellite.content_view:
        server_url: "{{ satellite_url }}"
        username: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        validate_certs: false
        organization: "{{ satellite_org }}"
        name: "{{ content_view }}"
        repositories:
          - name: 'Red Hat Enterprise Linux 9 for x86_64 - BaseOS RPMs 9'
            product: "{{ satellite_product }}"
          - name: 'Red Hat Enterprise Linux 9 for x86_64 - AppStream RPMs 9'
            product: "{{ satellite_product }}"
          - name: 'Red Hat Enterprise Linux 9 for x86_64 - Extensions RPMs 9'
            product: "{{ satellite_product }}"
          - name: 'Red Hat Enterprise Linux 10 for x86_64 - BaseOS RPMs 10'
            product: "{{ satellite_product }}"
          - name: 'Red Hat Enterprise Linux 10 for x86_64 - AppStream RPMs 10'
            product: "{{ satellite_product }}"
          - name: 'Red Hat Enterprise Linux 10 for x86_64 - Extensions RPMs 10'
            product: "{{ satellite_product }}"
        state: present

    - name: Publish and Promote Content View
      redhat.satellite.content_view_version:
        server_url: "{{ satellite_url }}"
        username: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        validate_certs: false
        organization: "{{ satellite_org }}"
        content_view: "{{ content_view }}"
        lifecycle_environments:
          - "{{ lifecycle_environment }}"
        state: present

    - name: Create Activation Key with Extensions Enabled
      redhat.satellite.activation_key:
        server_url: "{{ satellite_url }}"
        username: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        validate_certs: false
        organization: "{{ satellite_org }}"
        name: "{{ activation_key }}"
        lifecycle_environment: "{{ lifecycle_environment }}"
        content_view: "{{ content_view }}"
        content_overrides:
          - label: "rhel-9-for-x86_64-extensions-rpms"
            override_name: "enabled"
          - label: "rhel-10-for-x86_64-extensions-rpms"
            override_name: "enabled"
        state: present
