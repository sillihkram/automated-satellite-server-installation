---
- name: Onboard RHEL Hosts to Satellite, REX, Insights, and AI Services
  hosts: all
  remote_user: admin
  become: true
  gather_facts: true

  vars:
    satellite_fqdn: "dschubba.openincite.net"
    satellite_org: "openincite.net"
    activation_key: "rhel-soe-dev"
    katello_ca_cert: "/etc/rhsm/ca/katello-server-ca.pem"
    
    # Insights Role Configuration
    insights_display_name: "{{ ansible_fqdn }}"
    redhat_portal_username: ""
    insights_client_auto_config: true
    
    # AI / LightSpeed & MCP Endpoint Configurations
    lightspeed_url: "https://dschubba.openincite.net/api/v2/lightspeed"
    satellite_mcp_url: "https://dschubba.openincite.net/api/v2/mcp"

  tasks:
    # -------------------------------------------------------------------------
    # Step 1: Establish Certificate Trust
    # -------------------------------------------------------------------------
    - name: Download Katello CA Consumer RPM bypassing SSL check
      ansible.builtin.get_url:
        url: "https://{{ satellite_fqdn }}/pub/katello-ca-consumer-latest.noarch.rpm"
        dest: "/tmp/katello-ca-consumer-latest.noarch.rpm"
        validate_certs: false
        mode: '0644'

    - name: Install Katello CA Consumer RPM from local file
      ansible.builtin.dnf:
        name: "/tmp/katello-ca-consumer-latest.noarch.rpm"
        state: present
        disable_gpg_check: true

    - name: Remove temporary RPM file
      ansible.builtin.file:
        path: "/tmp/katello-ca-consumer-latest.noarch.rpm"
        state: absent

    - name: Copy Katello CA to system-wide trust anchors
      ansible.builtin.copy:
        src: "{{ katello_ca_cert }}"
        dest: /etc/pki/ca-trust/source/anchors/katello-server-ca.pem
        remote_src: true
        mode: '0644'
      notify: Update CA Trust

    - name: Force immediate update of system trust store
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    # Step 2: Register & Attach Content Subscriptions First
    # -------------------------------------------------------------------------
    - name: Register System to Satellite via Activation Key
      community.general.redhat_subscription:
        state: present
        org_id: "{{ satellite_org }}"
        activationkey: "{{ activation_key }}"
        server_hostname: "{{ satellite_fqdn }}"
        rhsm_baseurl: "https://{{ satellite_fqdn }}/pulp/content"
        rhsm_repo_ca_cert: "{{ katello_ca_cert }}"
        auto_attach: true
        force_register: false

    # -------------------------------------------------------------------------
    # Step 3: Install All Software Packages (Now that RHSM is active)
    # -------------------------------------------------------------------------
    - name: Install REX, Insights, and AI Packages
      ansible.builtin.dnf:
        name:
          - insights-client
          - command-line-assistant
          - goose-redhat
          - yggdrasil
          - foreman_yggdrasil
        state: present
      ignore_errors: true # In case optional AI tools are not in the active CV version yet

    # -------------------------------------------------------------------------
    # Step 4: Configure Remote Execution (Push & Pull)
    # -------------------------------------------------------------------------
    - name: Deploy Satellite SSH Public Key for Push REX
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ lookup('url', 'https://' + satellite_fqdn + '/pub/remote_execution_ssh_keys.pub', validate_certs=false) }}"

    - name: Ensure Yggdrasil daemon is active for Pull REX
      ansible.builtin.systemd:
        name: yggdrasild
        state: started
        enabled: true
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 5: Configure & Execute Insights Client
    # -------------------------------------------------------------------------
    - name: Pre-configure Insights client for Satellite proxy & trust
      ansible.builtin.ini_file:
        path: /etc/insights-client/insights-client.conf
        section: insights-client
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: '0644'
      loop:
        - { option: 'cert_verify', value: "{{ katello_ca_cert }}" }
        - { option: 'base_url', value: "https://{{ satellite_fqdn }}/redhat_access/r/insights" }

    - name: Execute Red Hat Insights Client Role
      ansible.builtin.include_role:
        name: redhat.insights.insights_client

    # -------------------------------------------------------------------------
    # Step 6: Configure AI Tools (Command-Line Assistant & Goose)
    # -------------------------------------------------------------------------
    - name: Configure Command-Line Assistant
      ansible.builtin.copy:
        dest: /etc/command-line-assistant/config.toml
        owner: root
        group: root
        mode: '0644'
        content: |
          [provider]
          type = "lightspeed"
          url = "{{ lightspeed_url }}"
          tls_skip_verify = true
          ca_cert = "{{ katello_ca_cert }}"

    - name: Configure Goose System-Wide Profile for Satellite MCP
      ansible.builtin.copy:
        dest: /etc/goose/config.yaml
        owner: root
        group: root
        mode: '0644'
        content: |
          GOOSE_PROVIDER: "lightspeed"
          LIGHTSPEED_URL: "{{ lightspeed_url }}"
          SSL_VERIFY: false
          extensions:
            satellite_mcp:
              type: "mcp"
              enabled: true
              uri: "{{ satellite_mcp_url }}"
              dangerously_allow_insecure: true

  handlers:
    - name: Update CA Trust
      ansible.builtin.command:
        cmd: update-ca-trust
