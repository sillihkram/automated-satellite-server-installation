---
- name: Pull subscription manifest from Red Hat and import to Satellite
  hosts: localhost
  gather_facts: false
  
  vars:
    # Your custom credential definitions (can be passed via Ansible Vault or extra vars)
    satellite_url: "https://dschubba.openincite.net"
    satellite_username: "admin"
    satellite_password: ""
    rhsm_username: "mark_hillis"
    rhsm_password: ""

  roles:
    - role: redhat.satellite.manifest
      vars:
        # Core connection variables expected by the role
        foreman_server_url: "{{ satellite_url }}"
        foreman_username: "{{ satellite_username }}"
        foreman_password: "{{ satellite_password }}"
        foreman_organization: "openincite.net"
        
        # Manifest download variables expected by the role
        foreman_manifest_download: true
        foreman_manifest_uuid: "9bfbeddb-2885-4ce0-8bbe-1bc812de39d4"
        foreman_rhsm_username: "{{ rhsm_username }}"
        foreman_rhsm_password: "{{ rhsm_password }}"
        foreman_manifest_path: "~/manifest.zip"
