# Installation Mode
text
reboot --eject

# Network
network --bootproto=static --device=ens192 --ip=192.168.1.247 --netmask=255.255.255.0 --gateway=192.168.1.1 --nameserver=192.168.1.254,192.168.1.1 --hostname=dschubba.openincite.net --noipv6 --activate

# Subscription
rhsm --organization="11972456" --activation-key="Production_AZ" --connect

# System Settings
lang en_US.UTF-8
keyboard us
timezone America/New_York --utc

# Authentication
rootpw --iscrypted $6$V.YDOuxAfIui2G2h$e/u61ES.C4O0F5gW3OLdrLzVYC0SSROlzOS7/L09OThaUzHtuyMyI9p.GdrUfrVBQK/JAUYc1.wsyILCvoKht.

user --name=admin --groups=wheel --password=$6$j1630.srE7bgMG6c$siVXwME0AJoYsBeJtulvfcRIxeYw.dCj.f4HXIJrT.EwRF/XBZ99gYCznfu1PJz0FYcaM.KHTI5650fCP5Ia6/ --iscrypted --gecos="Administrator"

# Bootloader
bootloader --boot-drive=sda --password=grub.pbkdf2.sha512.10000.45912D32B964BA58B91EAF9847F3CCE6F4C962638922543AFFAEE4D29951757F4336C181E6FC9030E07B7D9874DAD696A1B18978D995B1D7F27AF9C38159FDF3.99F65F3896012A0A3D571A99D6E6C695F3C51BE5343A01C1B6907E1C3E1373CB7F250C2BC66C44BB876961E9071F40205006A05189E51C2C14770C70C723F3FD --iscrypted

# Storage
zerombr
clearpart --all --initlabel --drives=sda,sdb

# --- OS Disk ---
part /boot/efi --fstype=vfat --size=600 --ondisk=sda
part /boot --fstype=xfs --size=1024 --ondisk=sda
part pv.01 --size=1 --grow --ondisk=sda

volgroup vg_os pv.01

logvol thinpool_os --name=thinpool_os --vgname=vg_os --thinpool --size=1 --grow --metadatasize=128

logvol / --fstype=xfs --vgname=vg_os --thin --poolname=thinpool_os --name=root --size=8192 --grow
logvol /home --fstype=xfs --vgname=vg_os --thin --poolname=thinpool_os --name=home --size=4096
logvol /opt --fstype=xfs --vgname=vg_os --thin --poolname=thinpool_os --name=opt --size=4096
logvol /tmp --fstype=xfs --vgname=vg_os --thin --poolname=thinpool_os --name=tmp --size=8192
logvol swap --fstype=swap --vgname=vg_os --name=swap --size=8192

# --- Data Disk ---
part pv.02 --size=1 --grow --ondisk=sdb

volgroup vg_data pv.02

logvol thinpool_data --name=thinpool_data --vgname=vg_data --thinpool --size=1 --grow --metadatasize=256

logvol /var --fstype=xfs --vgname=vg_data --thin --poolname=thinpool_data --name=var --size=20480 --grow
logvol /var/tmp --fstype=xfs --vgname=vg_data --thin --poolname=thinpool_data --name=vartmp --size=8192
logvol /var/log --fstype=xfs --vgname=vg_data --thin --poolname=thinpool_data --name=varlog --size=40960
logvol /var/log/audit --fstype=xfs --vgname=vg_data --thin --poolname=thinpool_data --name=varlogaudit --size=4096

# Security Hardening
%addon com_redhat_oscap
content-type = scap-security-guide
profile = xccdf_org.ssgproject.content_profile_cis_server_l1
%end

# Packages
%packages
@core
@security-tools
lvm2
%end

# Post-install
%post --log=/root/ks-post.log

echo "%wheel ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel_nopass
chmod 440 /etc/sudoers.d/wheel_nopass

mkdir -p -m 700 /home/admin/.ssh
cat << 'EOF' > /home/admin/.ssh/authorized_keys
ssh-rsa 
EOF

chmod 600 /home/admin/.ssh/authorized_keys
chown -R admin:admin /home/admin/.ssh

chage -E -1 -M -1 root
chage -E -1 -M -1 admin

echo "search openincite.net" >> /etc/resolv.conf
%end
