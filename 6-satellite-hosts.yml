---
- name: Onboard RHEL Hosts to Satellite, REX, Insights, and AI Services
  hosts: all
  remote_user: admin
  become: true
  gather_facts: true

  vars:
    satellite_fqdn: "dschubba.openincite.net"
    satellite_org: "openincite_net"  # Exact Satellite Org LABEL
    activation_key: "rhel-soe-dev"
    katello_ca_cert: "/etc/rhsm/ca/katello-server-ca.pem"
    
    # AI / LightSpeed & MCP Endpoints
    lightspeed_url: "https://dschubba.openincite.net/api/v2/lightspeed"
    satellite_mcp_url: "https://dschubba.openincite.net/api/v2/mcp"

  tasks:
    # -------------------------------------------------------------------------
    # Step 1: Trust CA & Register RHSM
    # -------------------------------------------------------------------------
    - name: Download Katello CA Consumer RPM bypassing SSL check
      ansible.builtin.get_url:
        url: "https://{{ satellite_fqdn }}/pub/katello-ca-consumer-latest.noarch.rpm"
        dest: "/tmp/katello-ca-consumer-latest.noarch.rpm"
        validate_certs: false
        mode: '0644'

    - name: Install Katello CA Consumer RPM
      ansible.builtin.dnf:
        name: "/tmp/katello-ca-consumer-latest.noarch.rpm"
        state: present
        disable_gpg_check: true

    - name: Cleanup temporary RPM
      ansible.builtin.file:
        path: "/tmp/katello-ca-consumer-latest.noarch.rpm"
        state: absent

    - name: Purge stale subscription identity data
      ansible.builtin.command:
        cmd: subscription-manager clean
      failed_when: false
      changed_when: false

    - name: Register system to Satellite via Activation Key
      redhat.rhel_system_roles.redhat_subscription:
        state: present
        org_id: "{{ satellite_org }}"
        activationkey: "{{ activation_key }}"
        server_hostname: "{{ satellite_fqdn }}"
        rhsm_baseurl: "https://{{ satellite_fqdn }}/pulp/content"
        rhsm_repo_ca_cert: "{{ katello_ca_cert }}"

    # -------------------------------------------------------------------------
    # Step 2: Install Insights and AI Packages
    # -------------------------------------------------------------------------
    - name: Install Insights and AI packages
      ansible.builtin.dnf:
        name:
          - insights-client
          - command-line-assistant
          - goose-redhat
        state: present

    # -------------------------------------------------------------------------
    # Step 3: Configure Push Remote Execution (SSH Key)
    # -------------------------------------------------------------------------
    - name: Fetch Satellite SSH Public Key
      ansible.builtin.set_fact:
        rex_pub_key: "{{ lookup('url', 'https://' + satellite_fqdn + '/pub/remote_execution_ssh_keys.pub', validate_certs=false, errors='ignore') }}"

    - name: Deploy Satellite SSH Public Key for Push REX
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ rex_pub_key }}"
      when: 
        - rex_pub_key is defined
        - rex_pub_key | length > 0

    # -------------------------------------------------------------------------
    # Step 4: Configure & Register Insights Client (Deterministic INI method)
    # -------------------------------------------------------------------------
    - name: Configure Insights Client for Satellite proxy
      community.general.ini_file:
        path: /etc/insights-client/insights-client.conf
        section: insights-client
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: '0644'
      loop:
        - { option: 'cert_verify', value: "{{ katello_ca_cert }}" }
        - { option: 'base_url', value: "https://{{ satellite_fqdn }}/redhat_access/r/insights" }

    - name: Register host with Red Hat Insights
      ansible.builtin.command:
        cmd: insights-client --register
      register: insights_reg
      changed_when: "'Successfully registered' in insights_reg.stdout or insights_reg.rc == 0"
      failed_when: false

    # -------------------------------------------------------------------------
    # Step 5: Configure Local AI Tools (Command-Line Assistant & Goose)
    # -------------------------------------------------------------------------
    - name: Configure Command-Line Assistant
      ansible.builtin.copy:
        dest: /etc/command-line-assistant/config.toml
        owner: root
        group: root
        mode: '0644'
        content: |
          [provider]
          type = "lightspeed"
          url = "{{ lightspeed_url }}"
          tls_skip_verify = true
          ca_cert = "{{ katello_ca_cert }}"

    - name: Configure Goose System-Wide Profile for Satellite MCP
      ansible.builtin.copy:
        dest: /etc/goose/config.yaml
        owner: root
        group: root
        mode: '0644'
        content: |
          GOOSE_PROVIDER: "lightspeed"
          LIGHTSPEED_URL: "{{ lightspeed_url }}"
          SSL_VERIFY: false
          extensions:
            satellite_mcp:
              type: "mcp"
              enabled: true
              uri: "{{ satellite_mcp_url }}"
              dangerously_allow_insecure: true
