---
- name: Configure Red Hat Satellite Server
  hosts: all
  connection: local
  gather_facts: false

  vars:
    satellite_org: "openincite.net"
    satellite_org_id: 1
    satellite_product: "Red Hat Enterprise Linux for x86_64"
    vcenters:
      - { name: 'vhost00', url: '192.168.1.20' }
      - { name: 'vhost01', url: '192.168.1.21' }

  tasks:
    - name: Configure Satellite Server API Resources and Repositories
      delegate_to: localhost
      run_once: true
      block:
        - name: Create VMware compute resources
          redhat.satellite.compute_resource:
            server_url: "{{ satellite_url }}"
            username: "{{ satellite_username }}"
            password: "{{ satellite_password }}"
            validate_certs: false
            name: "{{ item.name }}"
            organizations:
              - "{{ satellite_org }}"
            locations:
              - 'Default Location'
            provider: vmware
            provider_params:
              url: "{{ item.url }}"
              user: "{{ vmware_username }}"
              password: "{{ vmware_password }}"
              datacenter: "ha-datacenter"
              caching_enabled: false
            state: present
          loop: "{{ vcenters }}"

        - name: Create virt-who configurations for VMware vCenters
          ansible.builtin.uri:
            url: "{{ satellite_url }}/foreman_virt_who_configure/api/v2/configs"
            user: "{{ satellite_username }}"
            password: "{{ satellite_password }}"
            method: POST
            force_basic_auth: true
            body_format: json
            body:
              foreman_virt_who_configure_config:
                name: "virt-who-{{ item.name }}"
                organization_id: "{{ satellite_org_id }}"
                satellite_url: "{{ satellite_url }}"
                hypervisor_type: "esx"
                hypervisor_server: "{{ item.url }}"
                hypervisor_username: "{{ vmware_username }}"
                hypervisor_password: "{{ vmware_password }}"
                interval: "60"
                hypervisor_id: "hostname"
                filtering_mode: "none"
            status_code: [200, 201, 422]  # Fixed: Restored status codes
            validate_certs: false
          loop: "{{ vcenters }}"

        - name: Enable RHEL and Satellite Client Repositories
          redhat.satellite.repository_set:
            server_url: "{{ satellite_url }}"
            username: "{{ satellite_username }}"
            password: "{{ satellite_password }}"
            validate_certs: false
            organization: "{{ satellite_org }}"
            label: "{{ item.label }}"
            # Maps the loop's repos array cleanly depending on the definition below
            repositories: "{{ item.repos | default(omit) }}" 
            state: enabled
          loop:
            # RHEL 9
            - { label: 'rhel-9-for-x86_64-baseos-rpms', repos: [{ releasever: "9" }] }
            - { label: 'rhel-9-for-x86_64-appstream-rpms', repos: [{ releasever: "9" }] }
            - { label: 'rhel-9-for-x86_64-extensions-rpms', repos: [{ releasever: "9" }] }
            # Satellite Client 9 does not accept releasever filtering
            - { label: 'satellite-client-6-for-rhel-9-x86_64-rpms' } 
            
            # RHEL 10
            - { label: 'rhel-10-for-x86_64-baseos-rpms', repos: [{ releasever: "10" }] }
            - { label: 'rhel-10-for-x86_64-appstream-rpms', repos: [{ releasever: "10" }] }
            - { label: 'rhel-10-for-x86_64-extensions-rpms', repos: [{ releasever: "10" }] }
            # Satellite Client 10 does not accept releasever filtering
            - { label: 'satellite-client-6-for-rhel-10-x86_64-rpms' }

        - name: Create or update weekly RHEL sync plan
          redhat.satellite.sync_plan:
            server_url: "{{ satellite_url }}"
            username: "{{ satellite_username }}"
            password: "{{ satellite_password }}"
            validate_certs: false
            name: "Weekly RHEL Sync"
            organization: "{{ satellite_org }}"
            interval: "weekly"
            enabled: true
            sync_date: "2026-09-02 19:00:00 UTC"
            products:
              - "{{ satellite_product }}"
            state: present

        - name: Sync RHEL and Satellite Client Repositories
          redhat.satellite.repository_sync:
            server_url: "{{ satellite_url }}"
            username: "{{ satellite_username }}"
            password: "{{ satellite_password }}"
            validate_certs: false
            repository: "{{ item }}"
            product: "{{ satellite_product }}"
            organization: "{{ satellite_org }}"
          loop:
            - 'Red Hat Enterprise Linux 9 for x86_64 - BaseOS RPMs 9'
            - 'Red Hat Enterprise Linux 9 for x86_64 - AppStream RPMs 9'
            - 'Red Hat Enterprise Linux 9 for x86_64 - Extensions RPMs 9'
            - 'Red Hat Satellite Client 6 for RHEL 9 x86_64 (RPMs)'
            - 'Red Hat Enterprise Linux 10 for x86_64 - BaseOS RPMs 10'
            - 'Red Hat Enterprise Linux 10 for x86_64 - AppStream RPMs 10'
            - 'Red Hat Enterprise Linux 10 for x86_64 - Extensions RPMs 10'
            - 'Red Hat Satellite Client 6 for RHEL 10 x86_64 (RPMs)'
          async: 7200
          poll: 0

    - name: Fetch and Deploy Virt-Who Configurations directly on Host
      remote_user: admin
      become: true
      block:
        - name: Fetch existing virt-who configurations from Satellite API
          ansible.builtin.uri:
            url: "{{ satellite_url }}/foreman_virt_who_configure/api/v2/configs"
            user: "{{ satellite_username }}"
            password: "{{ satellite_password }}"
            method: GET
            force_basic_auth: true
            validate_certs: false
          register: existing_virt_who_configs
          delegate_to: localhost

        - name: Deploy virt-who deployment script as root
          ansible.builtin.shell: |
            TMP_SCRIPT=$(mktemp)
            curl -s -k -u "{{ satellite_username }}:{{ satellite_password }}" \
              "{{ satellite_url }}/foreman_virt_who_configure/api/v2/configs/{{ item.id }}/script" -o "$TMP_SCRIPT"
            bash "$TMP_SCRIPT"
            rm -f "$TMP_SCRIPT"
          loop: "{{ existing_virt_who_configs.json.results }}"
          when: item.name in ['virt-who-vhost00', 'virt-who-vhost01']
          args:
            creates: "/etc/virt-who.d/virt-who-config-{{ item.id }}.conf"
